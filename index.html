  <!-- Bookmark loading and UI interaction script -->
  <script>
    // --- 全局变量 ---
    let fullBookmarkData = [];
    let currentPath = []; // 跟踪当前导航路径

    // --- 核心应用初始化函数 ---
    function initializeApp() {
        const spinner = document.getElementById('loading-spinner');
        if (spinner) spinner.style.display = 'flex'; // Show spinner before fetch

        fetch('json/pintree.json') // 确保你的 JSON 文件名为 pintree.json 且在正确的路径
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (spinner) spinner.style.display = 'none'; // Hide spinner on success

                if (!Array.isArray(data)) {
                     console.error('Loaded data is not an array:', data);
                     throw new Error('Bookmark data is not in the expected format.');
                }


                fullBookmarkData = data;
                const rootPath = [{ title: '书签栏', children: fullBookmarkData }]; // 使用 JSON 文件中的根目录名

                // 渲染初始导航
                 const navigationContainer = document.getElementById('navigation');
                 if (navigationContainer) {
                     renderNavigation(fullBookmarkData, navigationContainer, true, rootPath);
                 } else {
                      console.error("Navigation container not found");
                 }


                // 决定初始视图
                if (fullBookmarkData.length > 0 && fullBookmarkData[0].type === 'folder') {
                    const firstItem = fullBookmarkData[0];
                    const initialPath = rootPath.concat({ title: firstItem.title, children: firstItem.children });
                    renderBookmarks(firstItem.children || [], initialPath);
                    updateSidebarActiveState(initialPath);
                    // 展开第一个侧边栏项
                    expandFirstSidebarItem();
                } else {
                    renderBookmarks(fullBookmarkData, rootPath);
                    updateSidebarActiveState(rootPath);
                }

            })
            .catch(error => {
                 console.error('加载书签时出错:', error);
                 if (spinner) spinner.style.display = 'none';
                  const bookmarksContainer = document.getElementById('bookmarks');
                  if(bookmarksContainer) bookmarksContainer.innerHTML = `<p class="text-red-500 text-center p-6">加载书签失败: ${error.message}。请检查 'json/pintree.json' 文件是否存在且格式正确。</p>`;
                 // 清空导航以防万一
                 const navigationContainer = document.getElementById('navigation');
                 if (navigationContainer) navigationContainer.innerHTML = '';
            });
    }

     function expandFirstSidebarItem() {
         const navigationContainer = document.getElementById('navigation');
         if (!navigationContainer) return;

         const firstNavItem = navigationContainer.querySelector('li'); // Get the first top-level LI
         if (firstNavItem) {
             const subList = firstNavItem.nextElementSibling;
             const toggleIcon = firstNavItem.querySelector('.transform.transition-transform');
             // Check if it *has* a sublist (UL element) immediately following it
             if (subList && subList.tagName === 'UL') {
                 subList.classList.remove('hidden'); // Show the sublist
                 if (toggleIcon) {
                     toggleIcon.classList.add('rotate-90'); // Rotate the icon
                 }
             }
         }
     }

    // --- UI 交互和渲染函数 ---

    // 搜索功能
    function searchBookmarks(query) {
        const results = searchInData(fullBookmarkData, query.toLowerCase());
        renderBookmarks(results, [{ title: '书签栏', children: fullBookmarkData }, { title: '搜索结果', children: results }]); // Adjust path for search
        const clearBtn = document.getElementById('clearSearchButton');
        const mobileClearBtn = document.getElementById('mobileClearSearchButton');
        if(clearBtn) clearBtn.classList.remove('hidden');
        if(mobileClearBtn) mobileClearBtn.classList.remove('hidden');
    }

    function searchInData(data, query) {
        let results = [];
        data.forEach(item => {
            let match = false;
            if (item.title && item.title.toLowerCase().includes(query)) {
                match = true;
            }
            if (item.url && item.url.toLowerCase().includes(query)) {
                match = true;
            }
            // Add tags search if needed later

            if (match && item.type === 'link') { // Primarily return links
                results.push(item);
            }

            if (item.children && item.children.length > 0) {
                const childResults = searchInData(item.children, query);
                results = results.concat(childResults);
            }
        });
        // Deduplicate results
         const uniqueResults = results.filter((item, index, self) =>
             index === self.findIndex((t) => (
                  (t.url || `folder_${t.title}`) === (item.url || `folder_${item.title}`) && t.title === item.title
              ))
         );
        return uniqueResults;
    }

    // 清除搜索结果并重置UI
    function clearSearchResults() {
        const rootPath = [{ title: '书签栏', children: fullBookmarkData }];
        if (fullBookmarkData.length > 0 && fullBookmarkData[0].type === 'folder') {
             const firstItem = fullBookmarkData[0];
             const initialPath = rootPath.concat({ title: firstItem.title, children: firstItem.children });
             renderBookmarks(firstItem.children || [], initialPath);
             updateSidebarActiveState(initialPath);
             expandFirstSidebarItem(); // Re-expand first item
        } else {
             renderBookmarks(fullBookmarkData, rootPath);
             updateSidebarActiveState(rootPath);
        }
        const searchInput = document.getElementById('searchInput');
        const mobileSearchInput = document.getElementById('mobileSearchInput');
        const clearBtn = document.getElementById('clearSearchButton');
        const mobileClearBtn = document.getElementById('mobileClearSearchButton');
        if(searchInput) searchInput.value = '';
        if(mobileSearchInput) mobileSearchInput.value = '';
        if(clearBtn) clearBtn.classList.add('hidden');
        if(mobileClearBtn) mobileClearBtn.classList.add('hidden');

        // Hide mobile search area if it was open
         const mobileSearchArea = document.getElementById('mobile-search-area');
         if (mobileSearchArea) mobileSearchArea.classList.add('hidden');

    }

    // 创建书签卡片元素
    function createCard(title, url, icon) {
        const card = document.createElement('div');
        card.className = 'cursor-pointer flex items-center hover:shadow-md transition-shadow duration-200 p-3 bg-white shadow-sm ring-1 ring-gray-900/5 dark:ring-gray-700/50 rounded-lg hover:bg-gray-50 dark:bg-gray-800/50 dark:hover:pintree-bg-gray-700/80'; // Slightly adjusted style
        card.onclick = () => window.open(url, '_blank');

        const cardIconContainer = document.createElement('div');
        cardIconContainer.className = 'w-8 h-8 mr-3 rounded-full flex-shrink-0 card-icon-bg flex items-center justify-center overflow-hidden ring-1 ring-gray-200 dark:ring-gray-700'; // Added ring

        const cardIcon = document.createElement('img');
         // Lazy loading for icons
         cardIcon.loading = 'lazy';
         cardIcon.decoding = 'async';
        cardIcon.src = icon || 'assets/default-icon.svg';
        cardIcon.alt = title.substring(0, 50); // Alt text limit
        cardIcon.className = 'w-full h-full object-contain';


         cardIcon.onerror = function() { // Use 'function' for 'this' binding if needed, or arrow func if not
             this.onerror=null; // Prevent infinite loop if default icon also fails
             this.src='assets/default-icon.svg';
         };

        cardIconContainer.appendChild(cardIcon);

        const cardContent = document.createElement('div');
        cardContent.className = 'flex flex-col overflow-hidden';

        const cardTitle = document.createElement('h2');
        cardTitle.className = 'text-sm font-semibold mb-0.5 truncate text-gray-800 dark:text-gray-300'; // Adjusted color/margin
        cardTitle.innerText = title;
        cardTitle.title = title; // Add full title on hover

        let cleanUrl = '无效链接';
        if (url) {
            try {
                // More robust URL cleaning
                const urlObj = new URL(url);
                cleanUrl = urlObj.hostname + (urlObj.pathname.length > 1 ? urlObj.pathname : '');
                cleanUrl = cleanUrl.replace(/\/$/, ''); // Remove trailing slash if path was just /
            } catch (e) {
                // If URL is invalid, show the original string truncated
                 cleanUrl = url.length > 30 ? url.substring(0, 27) + '...' : url;
            }
        }

        const cardUrl = document.createElement('p');
        cardUrl.className = 'text-xs text-gray-400 dark:text-gray-500 truncate';
        cardUrl.innerText = cleanUrl;
        cardUrl.title = url || ''; // Show full original URL on hover

        cardContent.appendChild(cardTitle);
        cardContent.appendChild(cardUrl);

        card.appendChild(cardIconContainer);
        card.appendChild(cardContent);

        return card;
    }

    // 创建文件夹卡片元素
    function createFolderCard(title, children, path) {
        const folderData = { title, children: children || [] }; // Ensure children is an array
        const card = document.createElement('div');
        // Added padding, hover effect, and transition

    // 更新侧边栏活动状态
     function updateSidebarActiveState(activePath) {
         const navigationContainer = document.getElementById('navigation');
         if (!navigationContainer) return;

         // Remove active class from all items first
         navigationContainer.querySelectorAll('.sidebar-active').forEach(el => el.classList.remove('sidebar-active'));

         // Find the LI corresponding to the *last* item in the activePath
         let targetLi = null;
         const targetTitle = activePath[activePath.length - 1].title;

         // Function to search recursively (needed if structure is complex)
         function findLiByTitle(container, title) {
             const listItems = container.children;
             for (let li of listItems) {
                 if (li.tagName !== 'LI') continue; // Skip ULs etc.
                  const link = li.querySelector('button > span > span.truncate'); // More specific selector
                 if (link && link.innerText.trim() === title.trim()) {
                     return li;
                 }
                 // Check sublists
                 const subList = li.nextElementSibling;
                  if (subList && subList.tagName === 'UL') {
                      const foundInSub = findLiByTitle(subList, title);
                      if (foundInSub) return foundInSub;
                  }
             }
             return null;
         }

          // Start search from the root navigation container
          // We need to find the element whose stored path matches the activePath
          const allListItems = navigationContainer.querySelectorAll('li');
          allListItems.forEach(li => {
               try {
                    const itemPath = JSON.parse(li.dataset.path || '[]');
                    // Compare paths (simple string comparison might work if order is guaranteed)
                    if (JSON.stringify(itemPath) === JSON.stringify(activePath)) {
                         targetLi = li;
                    }
               } catch (e) {
                    console.error("Error parsing path data from sidebar item:", e);
               }
          });


         if (targetLi) {
              const targetButton = targetLi.querySelector('button');
              if(targetButton) targetButton.classList.add('sidebar-active'); // Apply active class to the button inside LI

             // Ensure all parent ULs are visible and icons rotated
             let currentElement = targetLi;
             while (currentElement && currentElement !== navigationContainer) {
                 if (currentElement.tagName === 'UL') {
                     currentElement.classList.remove('hidden');
                      // Rotate the icon of the parent LI
                      const parentLi = currentElement.previousElementSibling;
                      if (parentLi && parentLi.tagName === 'LI') {
                           const parentIcon = parentLi.querySelector('.transform.transition-transform');
                           if (parentIcon) {
                               parentIcon.classList.add('rotate-90');
                           }
                      }
                 }
                 currentElement = currentElement.parentElement;
             }
         } else {
              // If the exact path isn't found (e.g., search results), maybe highlight the root or do nothing
              // console.warn("Could not find sidebar item for path:", activePath);
         }
     }

    // 通过路径获取文件夹数据
    function getFolderDataByPath(pathArray, dataTree) {
        let currentLevel = dataTree;
        if (!Array.isArray(pathArray) || pathArray.length === 0) return null; // Invalid path

        // Handle root path explicitly
        if (pathArray.length === 1 && pathArray[0].title === '书签栏') { // Use the correct root name
            return { title: '书签栏', children: dataTree, type: 'folder' };
        }

        // Traverse the path, starting after the root
        for (let i = 1; i < pathArray.length; i++) {
            const pathItemTitle = pathArray[i].title;
             if (!Array.isArray(currentLevel)) { // Safety check
                  console.error("Invalid data structure at level", i-1, "expected array, got:", currentLevel);
                  return null;
             }
            const foundFolder = currentLevel.find(folder => folder.title === pathItemTitle && folder.type === 'folder');

            if (foundFolder) {
                 // If it's the last item in the path array, we've found our target folder
                 if (i === pathArray.length - 1) {
                     return foundFolder;
                 }
                 // Otherwise, move down to its children for the next iteration
                 currentLevel = foundFolder.children || []; // Use empty array if no children
            } else {
                 console.error("Folder not found for path item:", pathItemTitle, "in level:", currentLevel);
                return null; // Folder segment not found
            }
        }
        // This part should ideally not be reached if the path is valid and leads to a folder
        return null;
    }

    // --- Helper Functions for Mobile Sidebar ---
    function openSidebar() {
        const offCanvasMenu = document.getElementById('off-canvas-menu');
        const offCanvasBackdrop = document.getElementById('off-canvas-backdrop');
        const offCanvasContent = document.getElementById('off-canvas-content');
         const sidebar2 = document.getElementById('sidebar-2');
         const mainNavigation = document.getElementById('navigation'); // Desktop nav

        if (!offCanvasMenu || !offCanvasBackdrop || !offCanvasContent || !sidebar2 || !mainNavigation) return;

        offCanvasMenu.classList.remove('hidden');

         // Clone navigation only if it doesn't exist in mobile sidebar
         if (!sidebar2.querySelector('#navigation-mobile')) {
             var navigationClone = mainNavigation.cloneNode(true);
             navigationClone.id = 'navigation-mobile'; // Unique ID for the clone
             // Remove existing active classes from the clone
              navigationClone.querySelectorAll('.sidebar-active').forEach(el => el.classList.remove('sidebar-active'));
              // Ensure all sublists in the clone are initially hidden and icons reset
              navigationClone.querySelectorAll('ul').forEach(ul => ul.classList.add('hidden'));
              navigationClone.querySelectorAll('.rotate-90').forEach(icon => icon.classList.remove('rotate-90'));

             sidebar2.innerHTML = ''; // Clear previous mobile nav if any
             sidebar2.appendChild(navigationClone);
             // Re-attach event listeners specifically to the cloned navigation
             attachMobileNavigationListeners(navigationClone);
         }

        // Animate in
        setTimeout(() => {
            if (offCanvasBackdrop) offCanvasBackdrop.classList.add('opacity-100');
            if (offCanvasContent) offCanvasContent.classList.add('translate-x-0');
        }, 10); // Short delay ensures transition triggers
    }

    function closeSidebar() {
        const offCanvasMenu = document.getElementById('off-canvas-menu');
        const offCanvasBackdrop = document.getElementById('off-canvas-backdrop');
        const offCanvasContent = document.getElementById('off-canvas-content');
        if (!offCanvasMenu || !offCanvasBackdrop || !offCanvasContent) return;

        offCanvasBackdrop.classList.remove('opacity-100');
        offCanvasContent.classList.remove('translate-x-0');

        setTimeout(() => {
            offCanvasMenu.classList.add('hidden');
             // Optional: remove the mobile nav clone if you want it fresh each time
             // const mobileNav = document.getElementById('sidebar-2').querySelector('#navigation-mobile');
             // if (mobileNav) mobileNav.remove();
        }, 300); // Match CSS transition duration
    }

    // Attach listeners specifically for the cloned mobile navigation
    function attachMobileNavigationListeners(container) {
        const navItems = container.querySelectorAll('li > button'); // Target buttons within LIs
        navItems.forEach(navButton => {
            const listItem = navButton.parentElement; // Get the parent LI
             const subList = listItem.nextElementSibling?.tagName === 'UL' ? listItem.nextElementSibling : null;
             const toggleIcon = navButton.querySelector('.transform.transition-transform');
             const hasSubFolders = subList !== null; // If a UL follows, it has subfolders

             navButton.onclick = (e) => {
                 e.stopPropagation();
                  const pathData = JSON.parse(listItem.dataset.path || '[]');
                  const folderData = pathData[pathData.length - 1]; // Get data for the clicked item

                  // Toggle sublist if it exists
                  if (hasSubFolders) {
                       const currentlyOpen = !subList.classList.contains('hidden');
                       subList.classList.toggle('hidden');
                       if (toggleIcon) toggleIcon.classList.toggle('rotate-90', !currentlyOpen);
                  }

                 // Render bookmarks for the clicked item
                  if (folderData && folderData.children) {
                       renderBookmarks(folderData.children, pathData);
                       updateSidebarActiveState(pathData); // Update desktop sidebar state as well
                  }

                 // Close the mobile sidebar after clicking an item
                 closeSidebar();
             };
        });
    }

    // --- 主题初始化和切换逻辑 ---
    function initializeTheme() {
        const themeToggleButton = document.getElementById('themeToggleButton');
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            applyDarkTheme();
        } else {
            applyLightTheme();
        }

        if (themeToggleButton) {
            themeToggleButton.addEventListener('click', toggleTheme);
        }

        // Listen for system changes only if no theme is saved
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (event) => {
            if (!localStorage.getItem('theme')) {
                 event.matches ? applyDarkTheme(false) : applyLightTheme(false); // Pass false to avoid saving
            }
        });
    }
     // Apply dark theme (optional param to prevent saving to localStorage)
     function applyDarkTheme(savePref = true) {
         const sunIcon = document.getElementById('sunIcon');
         const moonIcon = document.getElementById('moonIcon');
         document.documentElement.classList.add('dark');
         if (sunIcon) sunIcon.classList.add('hidden');
         if (moonIcon) moonIcon.classList.remove('hidden');
         if (savePref) localStorage.setItem('theme', 'dark');
     }

     // Apply light theme (optional param to prevent saving to localStorage)
     function applyLightTheme(savePref = true) {
         const sunIcon = document.getElementById('sunIcon');
         const moonIcon = document.getElementById('moonIcon');
         document.documentElement.classList.remove('dark');
         if (sunIcon) sunIcon.classList.remove('hidden');
         if (moonIcon) moonIcon.classList.add('hidden');
         if (savePref) localStorage.setItem('theme', 'light');
     }


    // Toggle theme
    function toggleTheme() {
        if (document.documentElement.classList.contains('dark')) {
            applyLightTheme();
        } else {
            applyDarkTheme();
        }
    }

  </script>

  <script>
    // 
    const correctPassword = "2025"; // 
    // ----------------------------------

    document.addEventListener('DOMContentLoaded', () => { // Ensure DOM is ready before accessing elements
        // 获取需要操作的 HTML 元素
        const loginContainer = document.getElementById('login-container');
        const mainContent = document.getElementById('main-content');
        const passwordInput = document.getElementById('password-input');
        const loginButton = document.getElementById('login-button');
        const errorMessage = document.getElementById('error-message');

         // Pre-initialize theme for the login screen itself
         initializeTheme();

        // 检查元素是否存在
        if (!loginContainer || !mainContent || !passwordInput || !loginButton || !errorMessage) {
            console.error("登录界面元素未找到，密码保护无法生效。");
             // Fallback: If login elements are missing, maybe show content directly?
             // Or display a different error. For now, we'll just log.
             // mainContent.style.display = 'block'; // Uncomment this line to show content if login fails to load
             // initializeApp(); // And initialize if showing content
            return; // Stop script execution if elements are missing
        }


        // 
        function attemptLogin() {
          const enteredPassword = passwordInput.value;
          if (enteredPassword === correctPassword) {
            loginContainer.style.display = 'none';
            mainContent.style.display = 'block';
            errorMessage.textContent = "";

			 // **** 修改这里：稍作延迟再初始化 ****
			 setTimeout(() => {
				 if (typeof initializeApp === 'function') {
					  initializeApp();
				 } else {
					  console.error("initializeApp 函数未找到！主内容可能无法正确加载。");
					  const bookmarksContainer = document.getElementById('bookmarks');
					  if(bookmarksContainer) bookmarksContainer.innerHTML = '<p class="text-red-500 text-center p-6">页面初始化失败，请刷新重试。</p>';
				 }
			 }, 0); // 使用 setTimeout 0 毫秒延迟，将执行推到下一个事件循环
			 // ****************************************

          } else {
            // 
            errorMessage.textContent = "密码错误，请重试。";
            passwordInput.value = "";
            passwordInput.focus();
          }
        }

        // 添加事件监听器
        loginButton.addEventListener('click', attemptLogin);
        passwordInput.addEventListener('keypress', function(event) {
          if (event.key === 'Enter') {
            event.preventDefault();
            attemptLogin();
          }
        });

        // 页面加载后聚焦密码框
        try {
             passwordInput.focus();
        } catch(e) {
             console.error("聚焦密码输入框失败: ", e);
        }
    });
  </script>
</body>
