  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Variables for sidebar elements
      const openSidebarButton = document.getElementById('open-sidebar-button');
      const closeSidebarButton = document.getElementById('close-sidebar-button');
      const offCanvasMenu = document.getElementById('off-canvas-menu');
      const offCanvasBackdrop = document.getElementById('off-canvas-backdrop');
      const offCanvasContent = document.getElementById('off-canvas-content');

      // Function to open the sidebar
      const openSidebar = () => {
        offCanvasMenu.classList.remove('hidden');
        // Clone navigation for mobile menu if not already present
        if (!document.getElementById('sidebar-2').querySelector('#navigation')) {
             var navigationClone = document.getElementById('navigation').cloneNode(true);
             // Ensure the clone also has an ID for potential targeting, though direct clone manipulation is fine
             navigationClone.id = 'navigation-mobile'; // Give it a unique ID if needed
             document.getElementById('sidebar-2').appendChild(navigationClone);
             // Re-attach event listeners to the cloned navigation items
             attachNavigationListeners(navigationClone);
         }

        setTimeout(() => {
          offCanvasBackdrop.classList.add('opacity-100');
          offCanvasContent.classList.add('translate-x-0');
        }, 10);
      };

      // Function to close the sidebar
      const closeSidebar = () => {
        offCanvasBackdrop.classList.remove('opacity-100');
        offCanvasContent.classList.remove('translate-x-0');
        setTimeout(() => {
          offCanvasMenu.classList.add('hidden');
           // Optionally remove the cloned navigation to reset state if needed
           const mobileNav = document.getElementById('sidebar-2').querySelector('#navigation-mobile');
           if (mobileNav) {
               // mobileNav.remove(); // Uncomment if you want to remove it on close
           }
        }, 300); // Match the duration of the transition
      };

        // Helper function to re-attach listeners (needed for cloned elements)
       function attachNavigationListeners(container) {
            const navItems = container.querySelectorAll('li');
            navItems.forEach(navItem => {
                 // Find the original folder data this nav item corresponds to - this is tricky without storing data on the element
                 // Simplified: Assume click handlers need re-binding based on structure/text
                 const linkText = navItem.querySelector('a')?.innerText;
                 const subList = navItem.nextElementSibling?.tagName === 'UL' ? navItem.nextElementSibling : null;
                 const toggleIcon = navItem.querySelector('.transform.transition-transform'); // Assuming this selector targets the icon

                 if (linkText) {
                      // Re-create the click logic - This part needs careful mapping back to your data structure
                      navItem.onclick = (e) => {
                           e.stopPropagation();
                           // Find the corresponding folder data based on linkText or a data attribute (if you add one)
                           // Example: findFolderData(linkText); // You need to implement findFolderData

                           // Simplified behavior: Toggle sublist if exists
                           if (subList) {
                                subList.classList.toggle('hidden');
                                if (toggleIcon) toggleIcon.classList.toggle('rotate-90');
                           }
                           // Add logic to render bookmarks for this folder
                           // Example: renderBookmarksForFolder(folderData, path); // You need to implement this

                           // Close sidebar after clicking an item in mobile view
                           closeSidebar();
                      };
                 }
            });
       }


      // Event listeners for open and close buttons
      // Ensure openSidebarButton exists before adding listener
      if (openSidebarButton) {
         openSidebarButton.addEventListener('click', openSidebar);
      }
      if (closeSidebarButton) {
         closeSidebarButton.addEventListener('click', closeSidebar);
      }
       if (offCanvasBackdrop) {
         offCanvasBackdrop.addEventListener('click', closeSidebar); // Close sidebar when clicking on the backdrop
       }


    // --- Keep the rest of your original bookmark/UI script here ---
    // Search functionality
    function searchBookmarks(query) {
      fetch('json/pintree.json')
        .then(response => response.json())
        .then(data => {
          const results = searchInData(data, query.toLowerCase());
          renderBookmarks(results, [{ title: 'Search Results', children: results }]);
           document.getElementById('clearSearchButton').classList.remove('hidden');
        })
        .catch(error => console.error('Error searching bookmarks:', error));
    }

    function searchInData(data, query) {
      let results = [];
      data.forEach(item => {
          // Check if item itself matches
          if (item.title.toLowerCase().includes(query) || (item.url && item.url.toLowerCase().includes(query))) {
               // Avoid adding folders themselves unless explicitly needed, focus on links or leaf nodes
               if(item.type === 'link'){
                   results.push(item);
               } else if (item.type === 'folder' && !item.children) { // Include empty folders if they match
                    // Decide if you want to include matching folders that are empty
                    // results.push(item);
               }
          }
          // Recursively search in children if it's a folder
          if (item.children && item.children.length > 0) {
               const childResults = searchInData(item.children, query);
               results = results.concat(childResults);
          }
      });
       // De-duplicate results based on URL or a unique ID if available
       const uniqueResults = results.filter((item, index, self) =>
           index === self.findIndex((t) => (
               t.url === item.url && t.title === item.title // Simple uniqueness check
           ))
       );
      return uniqueResults; // Return unique results
    }

    // Clear search results and reset UI
    function clearSearchResults() {
        fetch('json/pintree.json')
            .then(response => response.json())
            .then(data => {
                // Re-render the initial state (e.g., the first folder's content)
                const firstLayer = data;
                if (firstLayer.length > 0) {
                    const firstItem = firstLayer[0];
                    renderNavigation(firstLayer, document.getElementById('navigation'), true, [{ title: 'Bookmark', children: firstLayer }]); // Pass path
                    updateSidebarActiveState([{ title: 'Bookmark', children: firstLayer }, { title: firstItem.title, children: firstItem.children }]); // Update sidebar for first item
                    renderBookmarks(firstItem.children, [{ title: 'Bookmark', children: firstLayer }, { title: firstItem.title, children: firstItem.children }]); // Render first item's content
                } else {
                    renderNavigation(firstLayer, document.getElementById('navigation'), true, [{ title: 'Bookmark', children: firstLayer }]);
                    renderBookmarks(firstLayer, [{ title: 'Bookmark', children: firstLayer }]); // Render root if no items
                }
                document.getElementById('searchInput').value = '';
                document.getElementById('clearSearchButton').classList.add('hidden');
            })
            .catch(error => console.error('Error clearing search results:', error));
    }

    // --- Attach Search Listeners ---
    const searchButton = document.getElementById('searchButton');
    const searchInput = document.getElementById('searchInput');
    const clearSearchButton = document.getElementById('clearSearchButton');

     if (searchButton) {
         searchButton.addEventListener('click', () => {
             const query = searchInput.value;
             if (query) { // Only search if there's a query
                 searchBookmarks(query);
             }
         });
     }

    if (searchInput) {
        searchInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                const query = event.target.value;
                 if (query) { // Only search if there's a query
                     searchBookmarks(query);
                 }
            }
        });
         // Show/hide clear button based on input
         searchInput.addEventListener('input', () => {
             if (searchInput.value) {
                 clearSearchButton.classList.remove('hidden');
             } else {
                 clearSearchButton.classList.add('hidden');
             }
         });
    }

     if (clearSearchButton) {
         clearSearchButton.addEventListener('click', clearSearchResults);
     }


    // Create bookmark card element
    function createCard(title, url, icon) {
      const card = document.createElement('div');
      card.className = 'cursor-pointer flex items-center hover:shadow-sm transition-shadow p-4 bg-white shadow-sm ring-1 ring-gray-900/5 dark:pintree-ring-gray-800 rounded-lg hover:bg-gray-100 dark:pintree-bg-gray-900 dark:hover:pintree-bg-gray-800';
      card.onclick = () => window.open(url, '_blank'); // Make the whole card clickable

      const cardIconContainer = document.createElement('div');
       cardIconContainer.className = 'w-8 h-8 mr-4 rounded-full flex-shrink-0 card-icon-bg flex items-center justify-center overflow-hidden'; // Added flex centering

      const cardIcon = document.createElement('img');
      cardIcon.src = icon || 'assets/default-icon.svg'; // Use provided icon or default icon
      cardIcon.alt = title;
       // cardIcon.className = 'w-8 h-8 mr-4 rounded-full flex-shrink-0 card-icon-bg'; // Smaller size and rounded
       cardIcon.className = 'w-full h-full object-contain'; // Ensure icon fits container

      // Check if the image URL returns 404 and replace it with the default icon if it does
       cardIcon.onerror = () => {
           cardIcon.src = 'assets/default-icon.svg'; // Set default icon on error
           // cardIcon.style.backgroundColor = '#f0f0f0'; // Optional: set a background for default icon
       };


       cardIconContainer.appendChild(cardIcon); // Add img to container


      const cardContent = document.createElement('div');
      cardContent.className = 'flex flex-col overflow-hidden'; // Ensure the content is hidden if too long

      const cardTitle = document.createElement('h2');
      cardTitle.className = 'text-sm font-semibold mb-1 truncate dark:text-gray-400';
      cardTitle.innerText = title;

      // Clean URL by removing http(s) and trailing slash
      let cleanUrl = 'No URL';
       if (url) {
            cleanUrl = url.replace(/^https?:\/\//, '').replace(/\/$/, '');
       }


      const cardUrl = document.createElement('p');
      cardUrl.className = 'text-xs text-gray-400 truncate';
      cardUrl.innerText = cleanUrl; // Use cleaned URL

      cardContent.appendChild(cardTitle);
      cardContent.appendChild(cardUrl); // Add URL paragraph

       // card.appendChild(cardIcon);
       card.appendChild(cardIconContainer); // Append the container instead of the icon directly
      card.appendChild(cardContent);

      return card;
    }

    // Create folder card element
     function createFolderCard(title, children, path) {
        const folderData = { title, children }; // Store data needed for onclick
        const card = document.createElement('div');
        card.className = 'folder-card text-gray rounded-lg cursor-pointer flex flex-col items-center p-2 hover:bg-gray-100 dark:hover:pintree-bg-gray-800 transition-colors duration-150'; // Added padding and hover effect
        card.onclick = () => {
            // Recalculate the path correctly when clicking a folder card
            // The 'path' passed here is the *parent* path. Add the current folder to it.
            const newPath = path.concat(folderData);
            renderBookmarks(children, newPath);
            updateSidebarActiveState(newPath); // Update sidebar active state
        };

      const cardIconWrapper = document.createElement('div');
       cardIconWrapper.className = 'w-16 h-16 mb-1 flex items-center justify-center'; // Centered icon wrapper

      const cardIcon = document.createElement('div');
       cardIcon.innerHTML = `
           <svg viewBox="0 0 100 80" class="folder__svg w-full h-full"> <!-- Use w-full h-full -->
             <rect x="0" y="0" width="100" height="80" class="folder__back" />
             <rect x="15" y="8" width="70" height="60" class="paper-1" />
             <rect x="10" y="18" width="80" height="50" class="paper-2" />
             <rect x="0" y="10" width="100" height="70" class="folder__front" />
             <rect x="0" y="10" width="100" height="70" class="folder__front right" />
           </svg>
       `;
       // cardIcon.className = 'mb-2'; // Removed, using wrapper
       cardIconWrapper.appendChild(cardIcon);

      const cardTitle = document.createElement('h2');
      cardTitle.className = 'text-xs font-normal text-center w-full truncate dark:text-gray-400 px-1'; // Added horizontal padding
      cardTitle.innerText = title;

       // card.appendChild(cardIcon);
       card.appendChild(cardIconWrapper);

      return card;
    }

       // --- Global variable to store the full data ---
       let fullBookmarkData = [];

     // Find a folder's data in the nested structure based on a path array
     function getFolderDataByPath(pathArray, dataTree) {
         let currentLevel = dataTree;
         for (let i = 1; i < pathArray.length; i++) { // Start from index 1 to skip the root 'Bookmark'
             const pathItem = pathArray[i];
             const foundFolder = currentLevel.find(folder => folder.title === pathItem.title && folder.type === 'folder');
             if (foundFolder && foundFolder.children) {
                 currentLevel = foundFolder.children;
             } else {
                 console.error("Folder not found for path item:", pathItem);
                 return null; // Folder not found or doesn't have children
             }
         }
         // After the loop, currentLevel should be the children of the folder specified by the last item in pathArray
         // We need the folder item itself if the last operation was finding it
         if (pathArray.length > 1) {
              // To get the actual folder item, we need to search one level up
              let parentLevel = dataTree;
               for (let i = 1; i < pathArray.length -1 ; i++){
                    const pathItem = pathArray[i];
                    const parentFolder = parentLevel.find(folder => folder.title === pathItem.title && folder.type === 'folder');
                    if(parentFolder && parentFolder.children){
                         parentLevel = parentFolder.children;
                    } else {
                         return null;
                    }
               }
                const finalFolder = parentLevel.find(folder => folder.title === pathArray[pathArray.length -1].title && folder.type === 'folder');
                return finalFolder; // Return the folder object itself

         } else if (pathArray.length === 1 && pathArray[0].title === 'Bookmark') {
               return { title: 'Bookmark', children: dataTree, type: 'folder' }; // Return the root representation
         }

         return null; // Should not happen if path is valid
     }

               renderBookmarks(folder.children || [], currentItemPath); // Pass empty array if no children
               updateSidebarActiveState(currentItemPath); // Update active state based on the *clicked* item's path
           };


           // --- Sublist Rendering ---
           if (hasChildren) { // Only render sublist if there are sub-folders
               const subList = document.createElement('ul');
               subList.className = 'ml-4 space-y-1 hidden'; // Indent and hide by default
               renderNavigation(folder.children, subList, false, currentItemPath); // Recursive call with updated path
               // Insert sublist *after* the current navItem li
               navItem.insertAdjacentElement('afterend', subList);

    // Render breadcrumbs for navigation
    function renderBreadcrumbs(path) {
      const breadcrumbsPath = document.getElementById('breadcrumbs-path');
      breadcrumbsPath.innerHTML = ''; // Clear previous breadcrumbs
       currentPath = path; // Update global current path

      path.forEach((item, index) => {
        const breadcrumb = document.createElement('span');
         // Make only non-last items clickable
         if (index < path.length - 1) {
             breadcrumb.className = 'cursor-pointer hover:underline text-gray-500 dark:text-gray-400';
             breadcrumb.onclick = () => {
                 const newPath = path.slice(0, index + 1);
                 // Find the actual folder data corresponding to this breadcrumb click
                 const targetFolderData = getFolderDataByPath(newPath, fullBookmarkData);
                  if (targetFolderData) {
                       renderBookmarks(targetFolderData.children || [], newPath);
                       updateSidebarActiveState(newPath);
                  } else if (newPath.length === 1 && newPath[0].title === 'Bookmark') {
                       // Handle click on root "Bookmark"
                       renderBookmarks(fullBookmarkData, newPath);
                       updateSidebarActiveState(newPath);
                  }
                 document.getElementById('searchInput').value = ''; // Clear search on breadcrumb nav
                 document.getElementById('clearSearchButton').classList.add('hidden');
             };
         } else {
             // Last item (current view) - not clickable
             breadcrumb.className = 'text-gray-700 dark:text-white font-semibold';
         }

        breadcrumb.innerText = item.title;
        breadcrumbsPath.appendChild(breadcrumb);

        if (index < path.length - 1) {
          const separator = document.createElement('span');
           separator.className = 'mx-1 text-gray-400 dark:text-gray-500'; // Style separator
          separator.innerText = '>';
          breadcrumbsPath.appendChild(separator);
        }
      });
    }

    // Update the active state of sidebar items based on the current path
    function updateSidebarActiveState(activePath) {
        document.querySelectorAll('#navigation .sidebar-active').forEach(el => el.classList.remove('sidebar-active'));
        document.querySelectorAll('#navigation ul').forEach(ul => ul.classList.add('hidden')); // Collapse all first
        document.querySelectorAll('#navigation .rotate-90').forEach(icon => icon.classList.remove('rotate-90')); // Reset icons


        let currentNavContainer = document.getElementById('navigation');
         if (!currentNavContainer) return;


        for (let i = 0; i < activePath.length; i++) {
            const pathItem = activePath[i];
             if (pathItem.title === 'Bookmark') continue; // Skip the root 'Bookmark'


             // Find the li element corresponding to the current path item
             // This relies on finding the 'a' tag with the correct text inside the current container
             const listItems = Array.from(currentNavContainer.children).filter(child => child.tagName === 'LI');
             let foundNavItem = null;
              for (const li of listItems) {
                  const link = li.querySelector('a');
                   if (link && link.innerText.trim() === pathItem.title.trim()) {
                       foundNavItem = li;
                       break;
                   }
              }


             if (foundNavItem) {
                 // If it's the last item in the path, mark it active
                 if (i === activePath.length - 1) {
                     foundNavItem.classList.add('sidebar-active');
                 }

                 // Find the next UL (sublist) associated with this item
                  // The sublist UL is expected to be the immediate sibling *after* the LI
                  const subList = foundNavItem.nextElementSibling;

                 // If there's a sublist and we're not at the end of the path, expand it
                 if (subList && subList.tagName === 'UL' && i < activePath.length - 1) {
                     subList.classList.remove('hidden');
                     const toggleIcon = foundNavItem.querySelector('.transform.transition-transform');
                     if (toggleIcon) {
                         toggleIcon.classList.add('rotate-90');
                     }
                     currentNavContainer = subList; // Move down to the sublist for the next iteration
                 } else if (i < activePath.length -1 ) {
                      // If we expect a sublist but don't find one, stop traversing
                       break;
                 }
             } else {
                  // If a nav item for the path segment isn't found, stop
                   break;
             }
         }
     }

    // Render bookmarks (handles both folders and links)
    function renderBookmarks(data, path) {
      const container = document.getElementById('bookmarks');
      container.innerHTML = ''; // Clear previous content
       currentPath = path; // Update global path when rendering

      // Render breadcrumbs
      renderBreadcrumbs(path);

       // Ensure data is an array
       const itemsToRender = Array.isArray(data) ? data : [];


      // Separate folders and links
       const folders = itemsToRender.filter(item => item.type === 'folder');
       const links = itemsToRender.filter(item => item.type === 'link').sort((a, b) => (b.addDate || 0) - (a.addDate || 0)); // Handle potential missing addDate


      if (folders.length === 0 && links.length === 0) {
           const isSearch = path.length > 0 && path[path.length - 1].title === 'Search Results';
           showNoResultsMessage(isSearch); // Pass true if it's a search result page
        return;
      }

      // Create folder section
      if (folders.length > 0) {
        const folderSection = document.createElement('div');
         // Responsive grid columns
         folderSection.className = 'grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-8 xl:grid-cols-10 2xl:grid-cols-12 gap-4'; // Adjusted gaps and columns
        folders.forEach(folder => {
           // Pass the *current* path (path of the parent) to createFolderCard
          const card = createFolderCard(folder.title, folder.children || [], path);
          folderSection.appendChild(card);
        });
        container.appendChild(folderSection);
      }

      // Add separator line if both folders and links exist
      if (folders.length > 0 && links.length > 0) {
        const separator = document.createElement('hr');
         separator.className = 'my-6 border-t border-gray-200 dark:pintree-border-gray-800'; // Adjusted margin and color
        container.appendChild(separator);
      }

      // Create link section
      if (links.length > 0) {
        const linkSection = document.createElement('div');

         linkSection.className = 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4'; // Adjusted gaps and columns
        links.forEach(link => {
           const card = createCard(link.title, link.url, link.icon);
          linkSection.appendChild(card);
        });
        container.appendChild(linkSection);
      }

        // Don't automatically update sidebar here, let clicks handle it
        // updateSidebarActiveState(path); // Remove this line
    }

    // --- Initial Fetch and Render ---
    function initializeApp() {
        fetch('json/pintree.json')
            .then(response => response.json())
            .then(data => {
                 // Hide loading spinner
                 const spinner = document.getElementById('loading-spinner');
                 if (spinner) spinner.style.display = 'none';

                fullBookmarkData = data; // Store the fetched data globally
                const rootPath = [{ title: 'Bookmark', children: fullBookmarkData }];

                // Render initial navigation
                renderNavigation(fullBookmarkData, document.getElementById('navigation'), true, rootPath);

                // Decide initial view: either root or first folder
                 if (fullBookmarkData.length > 0 && fullBookmarkData[0].type === 'folder') {
                     // Show first folder content by default
                     const firstItem = fullBookmarkData[0];
                      const initialPath = rootPath.concat({ title: firstItem.title, children: firstItem.children });
                     renderBookmarks(firstItem.children || [], initialPath);
                      updateSidebarActiveState(initialPath); // Set sidebar state for the first item

                       // Explicitly expand the first item in the sidebar
                       const firstNavItem = document.getElementById('navigation')?.querySelector('li');
                       if(firstNavItem) {
                            const subList = firstNavItem.nextElementSibling;
                            const toggleIcon = firstNavItem.querySelector('.transform.transition-transform');
                             if(subList && subList.tagName === 'UL') {
                                 subList.classList.remove('hidden');
                                 if(toggleIcon) toggleIcon.classList.add('rotate-90');
                             }
                       }


                 } else {
                     // Show root content if no folders or first item is not a folder
                     renderBookmarks(fullBookmarkData, rootPath);
                      updateSidebarActiveState(rootPath); // Set sidebar state for the root
                 }

            })
            .catch(error => {
                 console.error('Error loading bookmarks:', error);
                 // Optionally hide the spinner and show an error message
                 const spinner = document.getElementById('loading-spinner');
                 if (spinner) spinner.style.display = 'none';
                  const bookmarksContainer = document.getElementById('bookmarks');
                  if(bookmarksContainer) bookmarksContainer.innerHTML = '<p class="text-red-500 text-center p-6">Error loading bookmarks. Please check the console.</p>';
            });
    }


    // Theme toggle functionality
    const themeToggleButton = document.getElementById('themeToggleButton');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    // Apply dark theme
    function applyDarkTheme() {
      document.documentElement.classList.add('dark');
       if(sunIcon) sunIcon.classList.add('hidden');
       if(moonIcon) moonIcon.classList.remove('hidden');
       localStorage.setItem('theme', 'dark'); // Store preference
    }

    // Apply light theme
    function applyLightTheme() {
      document.documentElement.classList.remove('dark');
       if(sunIcon) sunIcon.classList.remove('hidden');
       if(moonIcon) moonIcon.classList.add('hidden');
       localStorage.setItem('theme', 'light'); // Store preference
    }

    // Toggle theme between dark and light
    function toggleTheme() {
      if (document.documentElement.classList.contains('dark')) {
        applyLightTheme();
      } else {
        applyDarkTheme();
      }
    }

    // Check local storage or system preference for theme on load
    function initializeTheme() {
        const savedTheme = localStorage.getItem('theme');
         const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            applyDarkTheme();
        } else {
            applyLightTheme();
        }

         // Listen for changes in the system color theme preference
         window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (event) => {
              // Only apply system preference if no theme is explicitly saved
              if (!localStorage.getItem('theme')) {
                   applyColorTheme(event.matches ? 'dark' : 'light');
              }
         });

          // Add listener to the button
         if (themeToggleButton) {
             themeToggleButton.addEventListener('click', toggleTheme);
         }
    }

  <script>
    // 
    const correctPassword = "2025"; // 
    // ----------------------------------

    // 获取需要操作的 HTML 元素
    const loginContainer = document.getElementById('login-container');
    const mainContent = document.getElementById('main-content');
    const passwordInput = document.getElementById('password-input');
    const loginButton = document.getElementById('login-button');
    const errorMessage = document.getElementById('error-message'); // 获取显示错误信息的 <p> 元素

    // 尝试登录的函数
    function attemptLogin() {
      const enteredPassword = passwordInput.value; // 获取用户输入的密码
      if (enteredPassword === correctPassword) {
        // 密码正确
        loginContainer.style.display = 'none'; // 隐藏登录表单
        mainContent.style.display = 'block';  // 显示主要内容
        errorMessage.textContent = ""; // 清空错误信息

        // **** 重要：在这里调用你的主应用初始化函数 ****
        if (typeof initializeApp === 'function') {
            initializeApp();
        } else {
            console.error("initializeApp function not found! Main content might not load correctly.");
        }
        // ****************************************

      } else {
        // 密码错误
        errorMessage.textContent = "密码错误，请重试。"; // 显示错误提示
        passwordInput.value = ""; // 清空密码输入框
        passwordInput.focus(); // 让光标重新聚焦到密码输入框
      }
    }

    // 给登录按钮添加点击事件监听
    if (loginButton) {
        loginButton.addEventListener('click', attemptLogin);
    }


    // 给密码输入框添加键盘事件监听（按回车键也能登录）
    if (passwordInput) {
        passwordInput.addEventListener('keypress', function(event) {
          // 检查按下的键是否是 Enter 键
          if (event.key === 'Enter') {
            event.preventDefault(); // 阻止可能的默认行为（比如表单提交）
            attemptLogin(); // 调用登录函数
          }
        });

         // 页面加载后，自动聚焦到密码输入框，方便用户直接输入
         // Needs to wait slightly for the rest of the DOM potentially
         setTimeout(() => {
              passwordInput.focus();
         }, 100);
    } else {
        console.error("Password input field not found.");
    }


  </script>
